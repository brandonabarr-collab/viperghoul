<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIPERGHOUL // THE ARCADE FLOOR</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: #000;
        }

        .arcade-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* This now points directly to the image you just uploaded */
            background-image: url('arcade.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            image-rendering: pixelated;
        }

        .hotspot {
            position: absolute;
            background-color: rgba(0, 255, 102, 0.0);
            border: none;
            cursor: pointer;
            transition: background-color 0.2s, box-shadow 0.2s;
            z-index: 10;
        }

        .hotspot:hover {
            background-color: rgba(0, 255, 102, 0.15);
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.4);
        }

        /* MUSEUM Cabinet (Right-most) */
        #museum-hotspot {
            top: 26%;
            left: 79%;
            width: 15%;
            height: 54%;
        }
    </style>
</head>
<body>

    <div class="arcade-wrapper">
        <!-- Hotspot linking to your Museum page -->
        <a href="museum.html" id="museum-hotspot" class="hotspot" title="MUSEUM"></a>
    </div>

</body>
</html>
